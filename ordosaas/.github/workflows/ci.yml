name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ordosaas/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ordosaas_test
          POSTGRES_USER: ordosaas_app
          POSTGRES_PASSWORD: dev_password_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ordosaas/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run linter
        run: ruff check .

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://ordosaas_app:dev_password_change_me@localhost:5432/ordosaas_test
          SECRET_KEY: test_secret_key_32_chars_minimum_here
          ENVIRONMENT: test
        run: pytest tests/ -v --cov=app --cov=scheduling --cov-report=term-missing --cov-fail-under=75

      - name: Run example validation
        env:
          PYTHONPATH: .
        run: python -m tests.validate_example

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ordosaas/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ordosaas/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
